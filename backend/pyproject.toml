[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheus-backend"
version = "0.1.0"
description = "FastAPI backend for Project Prometheus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.14,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
